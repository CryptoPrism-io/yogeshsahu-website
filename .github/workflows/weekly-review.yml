name: Weekly Review

on:
  schedule:
    # 8:00 AM IST = 02:30 UTC (IST = UTC+5:30)
    - cron: "30 2 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate weekly review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
          THEMES_URL: ${{ secrets.THEMES_URL }}
          THEMES_KEY: ${{ secrets.THEMES_KEY }}
          SITE_OWNER: CryptoPrism-io
        run: node scripts/weekly-review.mjs

      - name: Commit auto-generated review
        id: commit
        run: |
          git config user.name "weekly-review-bot"
          git config user.email "weekly-review-bot@users.noreply.github.com"
          git add src/data/weekly-reviews.ts
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(reviews): add weekly review"
            echo "Pushing commit $(git rev-parse HEAD) to origin master..."
            git push origin HEAD:master
            PUSH_EXIT=$?
            if [ $PUSH_EXIT -ne 0 ]; then
              echo "::error::Git push failed with exit code $PUSH_EXIT"
              exit $PUSH_EXIT
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
